[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "polynetopo"
version = "0.5.0"
description = "Topology, shortest-path and spatial betweenness analysis for crosslinked polymer networks"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.0",
    "numpy",
    "igraph",
    "tqdm",
]
# `--function betweenness` additionally needs the in-house igraph build in
# vendor/ (Graph.edge_betweenness_spatial isn't in stock PyPI igraph) - see
# vendor/README.md. Not expressible as a pip dependency; build it separately.

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/zidan0x266/polynetopo"

[project.scripts]
polynetopo = "graph_analysis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
