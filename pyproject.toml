[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-analysis"
version = "0.3.0"
description = "Topology, shortest-path and spatial betweenness analysis for crosslinked polymer networks"
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.0",
    "numpy",
    "igraph",
    "tqdm",
]
# `--function betweenness` additionally needs the in-house igraph build in
# vendor/ (Graph.edge_betweenness_spatial isn't in stock PyPI igraph) - see
# vendor/README.md. Not expressible as a pip dependency; build it separately.

[project.scripts]
graph-analysis = "graph_analysis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
test = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
